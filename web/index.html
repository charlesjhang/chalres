<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>查爾斯影像｜營運中控台 MVP</title>
  <style>
    :root{--bg:#0b1220;--card:#121a2b;--muted:#8fa2c7;--text:#e8eefc;--ok:#2dd4bf;--warn:#f59e0b;--danger:#ef4444;--line:#22304b}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:linear-gradient(180deg,#0b1220,#0e172a);color:var(--text)}
    .wrap{max-width:1200px;margin:0 auto;padding:24px}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
    .title{font-size:24px;font-weight:700}.sub{color:var(--muted);font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
    .kpi h4{margin:0;color:var(--muted);font-size:12px}.kpi .v{font-size:28px;font-weight:700;margin-top:8px}
    .ok{color:var(--ok)} .warn{color:var(--warn)} .danger{color:var(--danger)}
    .main{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:12px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}
    th{color:var(--muted);font-weight:600}
    .tag{padding:3px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line)}
    .kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .col{background:#0f1829;border:1px solid var(--line);border-radius:10px;padding:8px}
    .col h5{margin:4px 4px 8px;color:var(--muted)}
    .item{background:#17233a;border:1px solid #273a5f;padding:8px;border-radius:8px;margin-bottom:8px;font-size:12px}
    @media (max-width: 900px){.grid{grid-template-columns:repeat(2,1fr)}.main{grid-template-columns:1fr}.kanban{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="title">查爾斯影像｜營運中控台（MVP 視覺草稿）</div>
        <div class="sub">日期：2026-05-04 ・ 模擬資料</div>
      </div>
      <span class="tag">Demo UI</span>
    </div>

    <div class="grid">
      <div class="card kpi"><h4>本月已入帳</h4><div class="v">NT$ 186,500</div></div>
      <div class="card kpi"><h4>本月成交金額</h4><div class="v">NT$ 248,000</div></div>
      <div class="card kpi"><h4>應收款</h4><div class="v warn">NT$ 62,000</div></div>
      <div class="card kpi"><h4>準時交付率</h4><div class="v ok">92%</div></div>
    </div>

    <div class="main">
      <div class="card">
        <h3 style="margin-top:0">案件看板</h3>
        <div class="kanban">
          <div class="col"><h5>待拍攝</h5><div class="item">Baker's 菜單照<br>5/8 拍攝</div></div>
          <div class="col"><h5>拍攝中</h5><div class="item">DR.CINK 主視覺<br>今日棚拍</div></div>
          <div class="col"><h5>修圖中</h5><div class="item">個人形象照 2 組<br>進度 60%</div></div>
          <div class="col"><h5>待交付</h5><div class="item">電商白底圖 30 張<br><span class="danger">D-1</span></div></div>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-top:0">風險提醒</h3>
        <table>
          <thead><tr><th>項目</th><th>狀態</th></tr></thead>
          <tbody>
            <tr><td>尾款未收（2案）</td><td class="warn">追蹤中</td></tr>
            <tr><td>3日內交付（3案）</td><td class="danger">高風險</td></tr>
            <tr><td>報價超過 7 天未回覆</td><td class="warn">5 筆</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
